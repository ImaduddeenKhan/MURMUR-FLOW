app = "whisperflow"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "whisperflow_data"
  destination = "/app/data"

[http_service]
  internal_port = 3050
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"
